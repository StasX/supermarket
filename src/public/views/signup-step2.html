<top-container class="container-fluid"></top-container>
<signup-step></signup-step>
<div class="col-sm-4 col-sm-offset-4 col-xs-6 col-xs-offset-3">
    <form name="form" ng-submit="submit()" class="container-fluid">
        <div class=" col-sm-offset-1 col-xs-offset-1 col-sm-10 col-xs-10" ng-show="alert">
                <div  class="alert alert-danger row">
                    <p> One ore more fields are empty or wrong!</p>
                    <p> Please recheck and try again.</p>
                </div>
            </div>
        <div class= "row">
            <select-city class="input-group col-sm-offset-1 col-xs-offset-1 col-sm-10  col-xs-10"></select-city>            
        </div>
        <div class= "row">
            <a-street class="input-group col-sm-offset-1 col-xs-offset-1 col-sm-10  col-xs-10"></a-street>
        </div>
        <div class= "row">
            <first-name class="input-group col-sm-offset-1 col-xs-offset-1 col-sm-10  col-xs-10"></first-name>
        </div>
        <div class= "row">
            <last-name class="input-group col-sm-offset-1 col-xs-offset-1 col-sm-10  col-xs-10"></last-name>
        </div>
        <div class="row">
            <input type="submit" class="btn btn-md btn-blue" ng-mousedown="save()" value="Save" />
        </div>
    </form>
</div>
