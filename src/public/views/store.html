<div class="top-container">
    <div class="row" style="display:inline-block; width:100%">
        <div class="col-sm-1 col-xs-2">
            <img src="assets/img/logo.jpg" width="70" height="70" /><!--width="45" height="56" />-->
        </div>
        <div class="col-sm-2 col-xs-2">
            <form ng-model="search" ng-submit="find()" class="col-sm-12 col-xs-12">
                    <div style="margin-top:30px;">
                        <input  id="find-product" type="search" class="form-control col-lg-2 col-md-4 col-sm-5 col-xs-5" ng-model="product" autocomplete="off" spellcheck="false" placeholder="find product"/>
                    </div>
                </form>
        </div>
        <div class="col-sm-2 col-xs-3" style="float:right; margin-top:10px;">
            <user-name style="width:100%"></user-name>
            <user-logout  class="row"></user-logout>
        </div>
    </div>
</div>
<div class="container col-sm-4 col-xs-4 cart" id="cart-container" style="display:inline-block">
    <h5 class="row">My Cart</h5>
    <hr />
    <div class="row">
    <ul class="container-fluid" id="cart">
        <li class="row">
            <ul class="container-fluid">
                <li class="col-sm-3 col-xs-3">Product</li>
                <li class="col-sm-3 col-xs-3">Count</li>
                <li class="col-sm-3 col-xs-3">Price</li>
                <li class="col-sm-3 col-xs-3">Total price</li>
            </ul>
        </li>
        <li class="row" ng-repeat="buy in cart">
            <ul class="container-fluid">
                <li class="col-sm-3 col-xs-3">{{buy.name}}</li>
                <li class="col-sm-3 col-xs-3">
                    <input type="number" ng-value="buy.count" min="1" ng-model="count" ng-change="changeCount()" autocomplete="off" spellcheck="false" />
                </li class="col-sm-3 col-xs-3">
                <li class="col-sm-3 col-xs-3">{{buy.price}}</li>
                <li class="col-sm-3 col-xs-3">{{totalPrices[$index]}}</li>
            </ul>
        </li>
    </ul>
    </div>
    <div class="row bottom">
        <div class="col-sm-6 col-xs-6 helf txt-center">
            <a ng-show="cart.length > 0" ng-click="continue()" ui-sref="order.cartOverView">Order now</a>
        </div>
        <div class="col-sm-6 col-xs-6">
            <b>Total: {{total}}$</b>
        </div>
    </div>
</div>
<store-shelf class="container col-sm-8 col-xs-8" style="padding:0px; position:fixed; right:0px; top:80px; bottom:0px;"></store-shelf>
