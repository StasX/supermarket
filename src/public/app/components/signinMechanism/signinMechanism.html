<form name="form" id="login-form" ng-submit="login()" class="container col-sm-12 col-xs-12">    
    <div class="row alert alert-danger" ng-show="alert">
        <p>Username or Password is wrong.</p> 
        <p>Try again!</p>
    </div>
    <div class="row">
            <input type="text" name="user" ng-model="user" required="required" user-directive class="col-sm-12  col-xs-12" placeholder="Username" autocomplete="off" spellcheck="false"/>
    </div>
    <div class= "row">
            <input type="password" name="pass" ng-model="pass" required="required" pass-directive class="col-sm-12 col-xs-12" placeholder="Password" />
    </div>
    <div class= "row">
            <input type="submit" class="btn-md btn-blue" value="Sign in"/>
    </div>
    <div class="row">
        <a ui-sref="signup" class="col-sm-4 col-xs-4 col-sm-offset-4 col-xs-offset-4">Sign up</a>
    </div>
</form>
