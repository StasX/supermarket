<div clas="container-fluid">
<h5 class="row">
    <span class="col-sm-4 col-xs-4">My Cart</span>
    <a ui-sref="store" ng-hide="back"  class=" offset-sm-8 offset-xs-8 col-sm-2 col-xs-2" style="float:right">Back to shop</a>
</h5>
<hr />
<div class="row">
    <ul class="container-fluid" id="cart">
        <li class="row">
            <ul class="col-sm-10 col-xs-10 col-xs-offset-1 col-sm-offset-1">
                <li class="col-sm-3 col-xs-3">Product</li>
                <li class="col-sm-3 col-xs-3">Count</li>
                <li class="col-sm-3 col-xs-3">Price</li>
                <li class="col-sm-3 col-xs-3">Total price</li>
            </ul>
        </li>
        <li class="row" ng-repeat="buy in cart">
            <ul class="col-sm-10 col-xs-10 col-xs-offset-1 col-sm-offset-1">
                <li class="col-sm-3 col-xs-3">{{buy.name}}</li>
                <li class="col-sm-3 col-xs-3">{{buy.count}}</li>
                <li class="col-sm-3 col-xs-3">{{buy.price}}</li>
                <li class="col-sm-3 col-xs-3">{{buy.price * buy.count}}</li>
            </ul>
        </li>
    </ul>
</div>
<div class="row bottom">
    <div class="col-sm-6 col-xs-6 helf txt-center">
        <b>Total: {{total}}$</b>
    </div>
    <div class="col-sm-6 col-xs-6 helf  txt-center">
        <a ui-sref="order.payment">Continue to order</a>
    </div>
    </div>
