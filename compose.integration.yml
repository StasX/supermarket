services:
  mongo:
    build:
      context: .
      dockerfile: db/Dockerfile
    tmpfs:
      - /data/db:uid=999,gid=999,mode=0700
  tests:
    build:
      context: .
      dockerfile: integration_tests/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/shop_integration
    depends_on:
      mongo:
        condition: service_healthy
