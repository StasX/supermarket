services:
  mongo:
    image: mongo:7
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: integration_tests/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/shop_integration
    depends_on:
      mongo:
        condition: service_healthy
