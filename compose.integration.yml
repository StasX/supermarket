services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    env_file:
      - integration_tests/.env.integration
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo:
    build:
      context: .
      dockerfile: db/Dockerfile
    tmpfs:
      - /data/db:uid=999,gid=999,mode=0700
  tests:
    build:
      context: .
      dockerfile: integration_tests/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/shop_integration
    env_file:
      - integration_tests/.env.integration
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
