services:
  minio:
    build:
      context: .
      dockerfile: minio/Dockerfile
    command: server /data
    env_file:
      - integration_tests/.env.integration
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700
  mongo:
    build:
      context: .
      dockerfile: db/Dockerfile
    tmpfs:
      - /data/db:uid=999,gid=999,mode=0700
  tests:
    build:
      context: .
      dockerfile: integration_tests/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/shop_integration
    env_file:
      - integration_tests/.env.integration
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
