name: Main

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Backend and frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Run existing tests
        run: npm test

  integration:
    name: Integration tests with MongoDB and MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run integration tests
        run: >-
          docker compose -p supermarket-integration -f integration.compose.yml
          up --build --abort-on-container-exit --exit-code-from tests

      - name: Show integration logs on failure
        if: failure()
        run: docker compose -p supermarket-integration -f integration.compose.yml logs --no-color

      - name: Clean up integration containers
        if: always()
        run: docker compose -p supermarket-integration -f integration.compose.yml down --volumes --remove-orphans
