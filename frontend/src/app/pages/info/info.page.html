<section class="panel">
  <span class="eyebrow">A PEEK INSIDE THE MARKET</span>
  <h1>Shop information</h1>
  @if (loading()) {
  <p role="status">Loading shop information…</p>
  } @else {
  <div class="stats">
    <p><strong>{{ products() }}</strong> products available</p>
    <p><strong>{{ orders() }}</strong> orders placed</p>
  </div>
  } @if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
  }
  <a class="button" routerLink="/store">Start shopping</a>
</section>
