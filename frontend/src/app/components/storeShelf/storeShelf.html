<div class="separator"></div>
<div class="container" style="display:inline-block; position:fixed">
    <div class="row">
        <nav class="col-sm-12 col-xs-12">
            <ul class="nav nav-pills">
                <li role="presentation" ng-click="milkAndEggs()">
                    <b>Milk & Eggs</b>
                </li>
                <li role="presentation" ng-click="vegetablesAndFruits()">
                    <b>Vegetables & Fruits</b>
                </li>
                <li role="presentation" ng-click="meetAndFish()">
                    <b>Meet & Fish</b>
                </li>
                <li role="presentation" ng-click="wineAndDrinks()">
                    <b>Wine & Drinks</b>
                </li>
            </ul>
        </nav>
    </div>
    <div class="row">
        <div ui-view class="col-sm-12 col-xs-12" id="shelf">
            <div class=" col-sm-3 col-xs-4 product-container" ng-repeat="product in products" ng-click="select($event)" style="display:inline-block">
                <div class="row"><img ng-src={{product.image}} height="80" width="140" /></div>
                <div class="row">
                    <div class="txt-center">{{product.name}}</div>
                </div>
                <div class="row">
                    <div class="txt-center">{{product.price}}$</div>
                </div>
            </div>
        </div>
    </div>
</div>
