<label for="pass-confirm" class="input-group-addon"><span>Password Confirm</span></label>
<input id="pass-confirm" type="password"  name="passConfirm" ng-blur="blur()" required="required" ng-pattern="pass" ng-model="passwordConfirm" confirm-directive class="form-control" placeholder="Confirm password" />
<span class="input-group-addon checker">
    <i class="{{className}}" aria-hidden="true"></i>
</span>
