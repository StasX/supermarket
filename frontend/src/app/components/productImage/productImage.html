<div class="input-group col-sm-10 col-xs-12 offset-sm-1">
    <label  for="image" class="input-group-addon"><span>Image</span></label>
    <input  id="image" type="url" name="image" ng-blur="blur()" required="required" ng-model="productImage" image-directive class="form-control" placeholder="Image" autocomplete="off" spellcheck="false" />
    <span class="input-group-addon checker">
        <i class="{{className}}" aria-hidden="true"></i>
    </span>
</div>
