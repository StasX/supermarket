<div class="row">
    <div class="col-sm-1 col-xs-2">
        <img src="assets/img/logo.jpg" width="70" height="70" />
    </div>
    <div class="col-sm-2 col-xs-2">
        <form ng-model="search" ng-submit="find()" class="row">
                <div class="input-group" class="margin-top:30px;">
                    <input  id="find-product" type="search" class="form-control col-lg-2 col-md-4 col-sm-5 col-xs-5" ng-model="product"  placeholder="find product" />
                </div>
            </form>
    </div>
    <div class="container col-sm-2 col-xs-3" style="float:right;max-height:78px">
        <user-name style="width:100%"></user-name>
        <user-logout  class="row"></user-logout>
    </div>
</div>
<div class="container col-sm-4 col-xs-4 cart" id="cart-container">
    <h5 class="row" ng-click="addProduct()">Add product &nbsp;<i class="fa fa-plus"></i></h5>
    <hr class="row" />
    <div class="row" ng-include="formContainer">
        
    </div>
</div>
<store-shelf class="container col-sm-8 col-xs-8"></store-shelf>
