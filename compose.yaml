services:
  app:
    build: &backend-build
      context: .
      dockerfile: Dockerfile
    ports:
      - ${PORT}:${PORT}
    environment:
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      JWT_KEY_PATH: ${JWT_KEY_PATH}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    env_file:
      - .env
    volumes:
      - app_keys:/app/keys
    depends_on:
      redis:
        condition: service_healthy
      db-indexes:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped

  db-indexes:
    build: *backend-build
    command: ['node', 'dist/database/migrate-indexes.js']
    environment:
      MONGODB_URI: ${MONGODB_URI}
    healthcheck:
      disable: true
    depends_on:
      mongodb:
        condition: service_healthy

  redis:
    build:
      context: .
      dockerfile: redis/Dockerfile
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile: minio/Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:9001:9001'
    restart: unless-stopped

  mongodb:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  redis_data:
  mongodb_data:
  app_keys:
  minio_data:
